<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Simulación — Eco-Clean</title>
    <style>body{font-family:Arial;margin:2rem}</style>
  </head>
  <body>
    <h1>Formulario de simulación</h1>
    <form action="/simulacion/ejecutar" method="post">
      <label>Tiempo máximo (horas o minutos según la unidad): <input name="tiempo" /></label>
      <br/>
      <label>Max iteraciones: <input name="max_iteraciones" /></label>
      <br/>
      <label>Mostrar i (filas): <input name="i" /></label>
      <br/>
      <label>Desde hora j: <input name="j" /></label>
      <br/>
      <label>Seed (opcional): <input name="seed" /></label>
      <br/>
      <button type="submit">Ejecutar simulación (placeholder)</button>
    </form>
    <p><a href="/">Volver al índice</a></p>
  </body>
</html>
